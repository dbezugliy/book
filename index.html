<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Club</title>
<style>
@font-face{font-family:"Boldstrom";src:url("Boldstrom.otf") format("opentype");font-display:swap}
:root{
  --bg:#d9d1bd;
  --hi:#e9e3d2;
  --ink:#000;
  --green:#7fa05a;
  --line:3px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --display:"Boldstrom",Impact,"Arial Black",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);min-height:100vh;border-bottom:var(--line) solid var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* top bar */
.bar{position:relative;display:grid;grid-template-columns:1fr 1fr;border-bottom:var(--line) solid var(--ink)}
.cell{font:700 1rem/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;background:none;color:inherit;border:0;border-radius:0;padding:1.15rem 0;cursor:pointer}
.cell+.cell{border-left:var(--line) solid var(--ink)}
.cell:hover{background:var(--hi)}
.editing #editBtn{background:var(--ink);color:var(--bg)}
#histPanel{position:absolute;left:0;right:0;top:calc(100% + var(--line));z-index:5;background:var(--bg);border-bottom:var(--line) solid var(--ink);max-height:60vh;overflow:auto}
#histPanel[hidden]{display:none}
.hist-item{display:block;padding:.85rem 1.25rem;color:inherit;text-decoration:none;font-size:1.05rem;line-height:1.3}
.hist-item+.hist-item,.hist-empty+.hist-item{border-top:2px solid var(--ink)}
a.hist-item:hover{background:var(--hi)}
.hist-item small{display:block;font-size:.95rem}
.hist-empty{padding:.85rem 1.25rem}

/* page */
.wrap{max-width:46rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.loading .wrap{visibility:hidden}
#msg{padding:1rem 1.25rem;font-weight:700}
#msg[hidden]{display:none}

.title{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12.5vw,5.6rem);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:1rem;font-size:1.15rem}
#yearView{flex:none}

/* editing fields */
.edit-only{display:none}
.editing .edit-only{display:block}
.editing .view-only{display:none}
.edit-input{font:inherit;color:inherit;background:var(--hi);border:2px dashed var(--ink);border-radius:0;padding:.3rem .5rem;width:100%}
textarea.title{resize:none;overflow:hidden;display:none;padding:.2rem .4rem}
.editing textarea.title{display:block}
#authorIn{flex:1}
#yearIn{width:6rem;flex:none;text-align:right}

/* cover + sticker */
.cover{position:relative;max-width:28rem;margin:1.75rem auto 2.4rem}
#coverLink{display:block;color:inherit}
#coverImg{display:block;width:100%;height:auto;border-radius:14px}
#coverImg[hidden]{display:none}
.cover-empty{aspect-ratio:2/3;border:var(--line) solid var(--ink);border-radius:14px;display:grid;place-items:center;text-align:center;padding:1rem;font-size:1.1rem}
.cover-empty[hidden]{display:none}
.overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3}
.cover-tag{position:absolute;top:.6rem;left:.6rem;background:var(--ink);color:var(--bg);padding:.3rem .65rem;font-weight:700;font-size:.95rem;pointer-events:none}
.editing .cover-tag{display:block}
#stickerBox{position:absolute;right:-.4rem;bottom:-1.2rem;width:clamp(8.5rem,40vw,11rem);aspect-ratio:1;transform:rotate(-9deg);z-index:2}
#stickerBox[hidden]{display:none}
#sticker{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);text-decoration:none}
#sticker svg{position:absolute;inset:0;width:100%;height:100%}
#stickerText{position:relative;font-weight:800;font-size:clamp(1.05rem,4.8vw,1.35rem);letter-spacing:.03em;white-space:nowrap}

/* edit tools */
.tools{margin-top:1rem;border:var(--line) solid var(--ink);padding:1rem;gap:.8rem}
.editing .tools{display:grid}
.tools p{font-size:1rem;line-height:1.35}
.tools label{font-weight:700}
.tools .edit-input{font-size:1rem}
.btn{font:700 1rem var(--serif);color:var(--ink);background:var(--bg);border:var(--line) solid var(--ink);border-radius:0;padding:.8rem 1rem;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
#saveState{min-height:1.3em;font-size:.95rem}
</style>
</head>
<body class="loading">

<header class="bar">
  <button class="cell" id="editBtn" type="button">Edit</button>
  <button class="cell" id="histBtn" type="button" aria-expanded="false" aria-controls="histPanel">History</button>
  <div id="histPanel" hidden></div>
</header>

<div id="msg" hidden></div>

<main class="wrap">
  <h1 class="title view-only" id="titleView"></h1>
  <textarea class="title edit-input edit-only" id="titleIn" rows="1" aria-label="Book title" maxlength="120"></textarea>

  <div class="meta">
    <span class="view-only" id="authorView"></span>
    <span class="view-only" id="yearView"></span>
    <input class="edit-input edit-only" id="authorIn" type="text" aria-label="Author" maxlength="80">
    <input class="edit-input edit-only" id="yearIn" type="text" inputmode="numeric" maxlength="4" aria-label="Year">
  </div>

  <div class="cover">
    <a id="coverLink">
      <img id="coverImg" alt="" hidden>
      <div class="cover-empty" id="coverEmpty"></div>
    </a>
    <input class="overlay edit-only" id="coverIn" type="file" accept="image/*" aria-label="Change cover photo">
    <span class="cover-tag edit-only">Change cover</span>
    <div id="stickerBox" hidden>
      <a id="sticker"><span id="stickerText"></span></a>
      <input class="overlay edit-only" id="dateIn" type="date" aria-label="Due date">
    </div>
  </div>

  <section class="tools edit-only" id="tools">
    <p>Editing. Tap the cover to change it and the sticker to pick the due date. Changes save automatically.</p>
    <label for="pdfIn">Google Drive PDF link</label>
    <input class="edit-input" id="pdfIn" type="url" placeholder="Paste the Drive share link" autocomplete="off">
    <button class="btn" id="newBtn" type="button">Start new book</button>
    <div id="saveState" role="status"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,updateDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7AKsuiU3NKxR_rWb2ktLJz1lOzSRdxAY",
  authDomain: "book-club-94d51.firebaseapp.com",
  projectId: "book-club-94d51",
  storageBucket: "book-club-94d51.firebasestorage.app",
  messagingSenderId: "832578051275",
  appId: "1:832578051275:web:8d9053c9bf620399230f4e"
};

const db = getFirestore(initializeApp(firebaseConfig));
const ref = doc(db, "club", "state");
const $ = id => document.getElementById(id);

const BLANK = {title:"Your Book Title", author:"Author Name", year:"", due:"", pdf:"", cover:""};
const NEW_BOOK = {...BLANK, title:"New Book"};
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

let state = {current:{...BLANK}, history:[]};
let editing = false;
let pending = {};
let timer = null;

/* ---------- helpers ---------- */
function ord(n){
  const t = n % 100;
  if (t >= 11 && t <= 13) return n + "th";
  return n + (["th","st","nd","rd"][n % 10] || "th");
}
function fmtDue(d){
  const [, m, day] = d.split("-").map(Number);
  return MONTHS[m-1] + " " + ord(day);
}
function calUrl(c){
  const [y, m, d] = c.due.split("-").map(Number);
  const f = x => x.toISOString().slice(0,10).replace(/-/g,"");
  const start = new Date(Date.UTC(y, m-1, d));
  const end = new Date(Date.UTC(y, m-1, d+1));
  const p = new URLSearchParams({
    action:"TEMPLATE",
    text:"Finish reading: " + c.title,
    dates:f(start) + "/" + f(end),
    details:"Book club deadline for " + c.title + (c.author ? " by " + c.author : "") + "."
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function pdfUrl(raw){
  raw = (raw || "").trim();
  if (!/^https?:\/\//i.test(raw)) return "";
  const m = raw.match(/\/d\/([\w-]+)/) || raw.match(/[?&]id=([\w-]+)/);
  if (m && /(drive|docs)\.google\.com/.test(raw)) {
    return "https://drive.google.com/uc?export=download&id=" + m[1];
  }
  return raw;
}
function autosize(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function setSave(text){ $("saveState").textContent = text; }

/* ---------- starburst ---------- */
(function(){
  const pts = [];
  for (let i = 0; i < 36; i++){
    const r = i % 2 ? 40 : 49;
    const a = i * Math.PI / 18;
    pts.push((50 + r*Math.cos(a)).toFixed(1) + "," + (50 + r*Math.sin(a)).toFixed(1));
  }
  $("sticker").insertAdjacentHTML("afterbegin",
    '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="' + pts.join(" ") +
    '" fill="var(--green)" stroke="#000" stroke-width="2.5" stroke-linejoin="miter"/></svg>');
})();

/* ---------- saving ---------- */
function queue(field, value){
  state.current[field] = value;
  pending[field] = value;
  setSave("Saving...");
  clearTimeout(timer);
  timer = setTimeout(flush, 350);
}
async function flush(){
  clearTimeout(timer);
  const keys = Object.keys(pending);
  if (!keys.length) return;
  const update = {};
  for (const k of keys) update["current." + k] = pending[k];
  pending = {};
  try {
    await updateDoc(ref, update);
    setSave("Saved");
  } catch (e) {
    setSave("Couldn't save. Check your connection and try again.");
  }
}

/* ---------- render ---------- */
function render(){
  const c = state.current;
  const url = pdfUrl(c.pdf);
  document.title = c.title || "Book Club";

  $("titleView").textContent = c.title || "Untitled";
  $("authorView").textContent = c.author || "";
  $("yearView").textContent = c.year || "";

  const fields = [["titleIn","title"],["authorIn","author"],["yearIn","year"],["pdfIn","pdf"]];
  for (const [id, key] of fields){
    const el = $(id);
    if (document.activeElement !== el) el.value = c[key] || "";
  }
  if (editing) autosize($("titleIn"));
  if (document.activeElement !== $("dateIn")) $("dateIn").value = c.due || "";

  // cover
  const img = $("coverImg");
  if (c.cover){
    if (img.getAttribute("src") !== c.cover) img.src = c.cover;
    img.alt = "Cover of " + (c.title || "the current book");
  }
  img.hidden = !c.cover;
  $("coverEmpty").hidden = !!c.cover;
  $("coverEmpty").textContent = editing ? "Tap to add a cover" : "No cover yet";

  const link = $("coverLink");
  if (!editing && url){
    link.href = url; link.target = "_blank"; link.rel = "noopener";
    link.setAttribute("aria-label", "Download the PDF of " + c.title);
  } else {
    link.removeAttribute("href"); link.removeAttribute("target");
    link.removeAttribute("rel"); link.removeAttribute("aria-label");
  }

  // sticker
  const box = $("stickerBox"), st = $("sticker");
  box.hidden = !(c.due || editing);
  $("stickerText").textContent = c.due ? fmtDue(c.due) : "SET DATE";
  if (!editing && c.due){
    st.href = calUrl(c); st.target = "_blank"; st.rel = "noopener";
    st.setAttribute("aria-label", "Add " + c.title + " due date to Google Calendar");
  } else {
    st.removeAttribute("href"); st.removeAttribute("target");
    st.removeAttribute("rel"); st.removeAttribute("aria-label");
  }

  // history
  const panel = $("histPanel");
  panel.replaceChildren();
  const items = [...(state.history || [])].reverse();
  if (!items.length){
    const p = document.createElement("div");
    p.className = "hist-empty";
    p.textContent = "No books yet.";
    panel.append(p);
  }
  for (const b of items){
    const u = pdfUrl(b.pdf);
    const el = document.createElement(u ? "a" : "div");
    el.className = "hist-item";
    if (u){ el.href = u; el.target = "_blank"; el.rel = "noopener"; }
    const t = document.createElement("strong");
    t.textContent = b.title || "Untitled";
    el.append(t);
    const sub = [b.author, b.year].filter(Boolean).join(", ");
    if (sub){
      const s = document.createElement("small");
      s.textContent = sub;
      el.append(s);
    }
    panel.append(el);
  }
}

function setMode(){
  document.body.classList.toggle("editing", editing);
  $("editBtn").textContent = editing ? "Done" : "Edit";
  setSave("");
  render();
}

/* ---------- events ---------- */
$("editBtn").addEventListener("click", () => {
  editing = !editing;
  if (!editing) flush();
  setMode();
});

$("histBtn").addEventListener("click", e => {
  e.stopPropagation();
  const open = $("histPanel").hidden;
  $("histPanel").hidden = !open;
  $("histBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => {
  if (!$("histPanel").hidden && !$("histPanel").contains(e.target)){
    $("histPanel").hidden = true;
    $("histBtn").setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("histPanel").hidden){
    $("histPanel").hidden = true;
    $("histBtn").setAttribute("aria-expanded", "false");
    $("histBtn").focus();
  }
});

$("titleIn").addEventListener("input", e => {
  queue("title", e.target.value);
  autosize(e.target);
  $("titleView").textContent = e.target.value || "Untitled";
});
$("titleIn").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
});
$("authorIn").addEventListener("input", e => queue("author", e.target.value));
$("yearIn").addEventListener("input", e => queue("year", e.target.value.replace(/\D/g, "")));
$("pdfIn").addEventListener("input", e => queue("pdf", e.target.value.trim()));
$("dateIn").addEventListener("change", e => {
  queue("due", e.target.value);
  render();
});

async function resizeCover(file){
  const bmp = await createImageBitmap(file);
  const max = 720;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * scale);
  cv.height = Math.round(bmp.height * scale);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.82, out;
  do { out = cv.toDataURL("image/jpeg", q); q -= 0.12; } while (out.length > 600000 && q > 0.3);
  return out;
}
$("coverIn").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    setSave("Saving...");
    queue("cover", await resizeCover(file));
    render();
  } catch (err) {
    setSave("That image couldn't be read. Try a JPG or PNG.");
  }
});

$("newBtn").addEventListener("click", async () => {
  const c = state.current;
  if (!confirm("Move \u201C" + (c.title || "Untitled") + "\u201D to History and start a new book?")) return;
  flush();
  try {
    await updateDoc(ref, {
      history: arrayUnion({title:c.title || "Untitled", author:c.author || "", year:c.year || "", pdf:c.pdf || ""}),
      current: {...NEW_BOOK}
    });
    setSave("New book started");
  } catch (err) {
    setSave("Couldn't start a new book. Check your connection and try again.");
  }
});

window.addEventListener("resize", () => { if (editing) autosize($("titleIn")); });
if (document.fonts) document.fonts.ready.then(() => { if (editing) autosize($("titleIn")); });

/* ---------- live data ---------- */
onSnapshot(ref, snap => {
  if (!snap.exists()){
    if (!snap.metadata.fromCache) setDoc(ref, {current:{...BLANK}, history:[]});
    return;
  }
  const d = snap.data();
  state = {current:{...BLANK, ...d.current, ...pending}, history:d.history || []};
  $("msg").hidden = true;
  document.body.classList.remove("loading");
  render();
}, () => {
  document.body.classList.remove("loading");
  $("msg").hidden = false;
  $("msg").textContent = "Couldn't load the book. Check your connection and refresh.";
});
</script>
</body>
</html>
