<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Club</title>
<style>
@font-face{font-family:"Boldstrom";src:url("Boldstrom.otf") format("opentype");font-display:swap}
:root{
  --bg:#d9d1bd;
  --hi:#e9e3d2;
  --ink:#000;
  --sticker:#f9c66d;
  --line:3px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --display:"Boldstrom",Impact,"Arial Black",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:400;min-height:100vh;border-bottom:var(--line) solid var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* top bar */
.bar{position:relative;z-index:6;display:grid;grid-template-columns:1fr 1fr;border-bottom:var(--line) solid var(--ink)}
.cell{font:400 .8rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:none;color:inherit;border:0;border-radius:0;padding:.55rem 0;cursor:pointer}
.cell+.cell{border-left:var(--line) solid var(--ink)}
.cell:hover{background:var(--hi)}
.editing #editBtn{background:var(--ink);color:var(--bg)}
#histPanel{position:absolute;left:0;right:0;top:calc(100% + var(--line));z-index:5;background:var(--bg);border-bottom:var(--line) solid var(--ink);max-height:60vh;overflow:auto}
#histPanel[hidden]{display:none}
.hist-item{display:block;padding:.45rem .65rem;color:inherit;text-decoration:none;font-size:1rem;line-height:1.25}
.hist-item+.hist-item,.hist-empty+.hist-item{border-top:2px solid var(--ink)}
a.hist-item:hover{background:var(--hi)}
.hist-item small{display:block;font-size:.9rem}
strong{font-weight:400}
.hist-item .edit-input{margin-top:.3rem;font-size:.95rem}
.hist-empty{padding:.45rem .65rem}

/* page */
.wrap{max-width:46rem;margin:0 auto;padding:.65rem .65rem 1.5rem}
.loading .wrap{visibility:hidden}
#msg{padding:.5rem .65rem;font-weight:700}
#msg[hidden]{display:none}

.title{position:relative;z-index:3;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12.5vw,5.6rem);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.meta{position:relative;z-index:1;display:flex;align-items:baseline;margin-top:.5rem;font-size:1.05rem;letter-spacing:.02em}

/* editing fields */
.edit-only{display:none}
.editing .edit-only{display:block}
.editing .view-only{display:none}
.edit-input{font:inherit;color:inherit;background:var(--hi);border:2px dashed var(--ink);border-radius:0;padding:.15rem .3rem;width:100%}
textarea.title.edit-input{resize:none;overflow:hidden;display:none;padding:.1rem .25rem;font-family:var(--display);line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.editing textarea.title.edit-input{display:block}
#authorIn{flex:1}

/* cover + sticker */
.cover{position:relative;max-width:28rem;margin:.9rem auto 1.2rem}
#coverLink{display:block;color:inherit}
#coverImg{display:block;width:100%;height:auto;border-radius:14px}
#coverImg[hidden]{display:none}
.cover-empty{aspect-ratio:2/3;border:var(--line) solid var(--ink);border-radius:14px;display:grid;place-items:center;text-align:center;padding:.5rem;font-size:1.05rem}
.cover-empty[hidden]{display:none}
.overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}
.cover-tag{position:absolute;top:.4rem;left:.4rem;background:var(--ink);color:var(--bg);padding:.2rem .45rem;font:400 .8rem var(--display);pointer-events:none}
#stickerBox{--s:clamp(7.5rem,36vw,9.5rem);position:absolute;right:.3rem;top:calc(var(--s) * -0.667);width:var(--s);aspect-ratio:1;transform:rotate(-9deg);z-index:2}
.editing #stickerBox{z-index:4}
#stickerBox[hidden]{display:none}
#sticker{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
#sticker svg{position:absolute;inset:0;width:100%;height:100%}
#stickerText{position:relative;font:400 1.4rem var(--display);letter-spacing:.02em;white-space:nowrap}
#dueIn{position:relative;width:80%;text-align:center;font:400 1.4rem var(--display);color:var(--ink);background:transparent;border:2px dashed var(--ink);border-radius:0;padding:.05rem .1rem}

/* edit tools */
.tools{margin-top:.5rem;border:var(--line) solid var(--ink);padding:.5rem;gap:.4rem}
.editing .tools{display:grid}
.tools p{font-size:.95rem;line-height:1.3}
.tools label{font-weight:400}
.tools .edit-input{font-size:1rem}
.btn{font:400 1rem var(--display);color:var(--ink);background:var(--bg);border:var(--line) solid var(--ink);border-radius:0;padding:.4rem .6rem;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
#saveState{min-height:1.3em;font-size:.95rem}
</style>
</head>
<body class="loading">

<header class="bar">
  <button class="cell" id="editBtn" type="button">Edit</button>
  <button class="cell" id="histBtn" type="button" aria-expanded="false" aria-controls="histPanel">History</button>
  <div id="histPanel" hidden></div>
</header>

<div id="msg" hidden></div>

<main class="wrap">
  <h1 class="title view-only" id="titleView"></h1>
  <textarea class="title edit-input edit-only" id="titleIn" rows="1" aria-label="Book title" maxlength="120"></textarea>

  <div class="meta">
    <span class="view-only" id="authorView"></span>
    <input class="edit-input edit-only" id="authorIn" type="text" aria-label="Author" maxlength="80">
  </div>

  <div class="cover">
    <a id="coverLink">
      <img id="coverImg" alt="" hidden>
      <div class="cover-empty" id="coverEmpty"></div>
    </a>
    <input class="overlay edit-only" id="coverIn" type="file" accept="image/*" aria-label="Change cover photo">
    <span class="cover-tag edit-only">Change cover</span>
    <div id="stickerBox" hidden>
      <div id="sticker">
        <span class="view-only" id="stickerText"></span>
        <input class="edit-only" id="dueIn" type="text" maxlength="14" placeholder="MAY 9th" aria-label="Due date text" autocomplete="off">
      </div>
    </div>
  </div>

  <section class="tools edit-only" id="tools">
    <p>Editing. Tap the cover to change it. Type the due date as you want it shown, like MAY 9th. Changes save automatically.</p>
    <label for="pdfIn">Google Drive PDF link (current book)</label>
    <input class="edit-input" id="pdfIn" type="url" placeholder="Paste the Drive share link" autocomplete="off">
    <p>Links for earlier books can be fixed in History while editing.</p>
    <button class="btn" id="newBtn" type="button">Start new book</button>
    <div id="saveState" role="status"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,updateDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7AKsuiU3NKxR_rWb2ktLJz1lOzSRdxAY",
  authDomain: "book-club-94d51.firebaseapp.com",
  projectId: "book-club-94d51",
  storageBucket: "book-club-94d51.firebasestorage.app",
  messagingSenderId: "832578051275",
  appId: "1:832578051275:web:8d9053c9bf620399230f4e"
};

const db = getFirestore(initializeApp(firebaseConfig));
const ref = doc(db, "club", "state");
const $ = id => document.getElementById(id);

const BLANK = {title:"Your Book Title", author:"Author Name", due:"", pdf:"", cover:""};
const NEW_BOOK = {...BLANK, title:"New Book"};

let state = {current:{...BLANK}, history:[]};
let editing = false;
let pending = {};
let timer = null;
let histPending = {};
let histTimer = null;

/* ---------- helpers ---------- */
function pdfUrl(raw){
  raw = (raw || "").trim();
  if (!/^https?:\/\//i.test(raw)) return "";
  const m = raw.match(/\/d\/([\w-]+)/) || raw.match(/[?&]id=([\w-]+)/);
  if (m && /(drive|docs)\.google\.com/.test(raw)) {
    return "https://drive.google.com/uc?export=download&id=" + m[1];
  }
  return raw;
}
function setSave(text){ $("saveState").textContent = text; }

/* Title: capped height, font shrinks to fit */
function fitTitle(){
  const el = editing ? $("titleIn") : $("titleView");
  const maxH = Math.max(90, Math.min(window.innerWidth * 0.3, 150));
  let size = Math.max(41.6, Math.min(window.innerWidth * 0.125, 89.6));
  el.style.fontSize = size + "px";
  el.style.height = "auto";
  while (el.scrollHeight > maxH && size > 14){
    size -= 1.5;
    el.style.fontSize = size + "px";
    el.style.height = "auto";
  }
  if (editing) el.style.height = el.scrollHeight + "px";
}

/* Sticker text: shrinks to stay inside the burst */
function fitSticker(){
  const box = $("stickerBox");
  if (box.hidden || !box.clientWidth) return;
  const el = editing ? $("dueIn") : $("stickerText");
  const maxW = box.clientWidth * 0.8;
  let size = Math.max(18, Math.min(window.innerWidth * 0.065, 30));
  el.style.fontSize = size + "px";
  const over = () => editing ? el.scrollWidth > el.clientWidth : el.offsetWidth > maxW;
  while (over() && size > 9){
    size -= 1;
    el.style.fontSize = size + "px";
  }
}
function fitAll(){ fitTitle(); fitSticker(); }

/* ---------- starburst ---------- */
(function(){
  const pts = [];
  for (let i = 0; i < 36; i++){
    const r = i % 2 ? 40 : 49;
    const a = i * Math.PI / 18;
    pts.push((50 + r*Math.cos(a)).toFixed(1) + "," + (50 + r*Math.sin(a)).toFixed(1));
  }
  $("sticker").insertAdjacentHTML("afterbegin",
    '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="' + pts.join(" ") +
    '" fill="var(--sticker)" stroke="#000" stroke-width="2.5" stroke-linejoin="miter"/></svg>');
})();

/* ---------- saving ---------- */
function queue(field, value){
  state.current[field] = value;
  pending[field] = value;
  setSave("Saving...");
  clearTimeout(timer);
  timer = setTimeout(flush, 350);
}
async function flush(){
  clearTimeout(timer);
  const keys = Object.keys(pending);
  if (!keys.length) return;
  const update = {};
  for (const k of keys) update["current." + k] = pending[k];
  pending = {};
  try {
    await updateDoc(ref, update);
    setSave("Saved");
  } catch (e) {
    setSave("Couldn't save. Check your connection and try again.");
  }
}

function queueHist(idx, value){
  state.history[idx] = {...state.history[idx], pdf:value};
  histPending[idx] = value;
  setSave("Saving...");
  clearTimeout(histTimer);
  histTimer = setTimeout(flushHist, 350);
}
async function flushHist(){
  clearTimeout(histTimer);
  if (!Object.keys(histPending).length) return;
  const list = state.history.map(b => ({...b}));
  histPending = {};
  try {
    await updateDoc(ref, {history:list});
    setSave("Saved");
  } catch (e) {
    setSave("Couldn't save. Check your connection and try again.");
  }
}

/* ---------- render ---------- */
function render(){
  const c = state.current;
  const url = pdfUrl(c.pdf);
  document.title = c.title || "Book Club";

  $("titleView").textContent = c.title || "Untitled";
  $("authorView").textContent = c.author || "";
  $("stickerText").textContent = c.due || "";

  const fields = [["titleIn","title"],["authorIn","author"],["dueIn","due"],["pdfIn","pdf"]];
  for (const [id, key] of fields){
    const el = $(id);
    if (document.activeElement !== el) el.value = c[key] || "";
  }

  // cover
  const img = $("coverImg");
  if (c.cover){
    if (img.getAttribute("src") !== c.cover) img.src = c.cover;
    img.alt = "Cover of " + (c.title || "the current book");
  }
  img.hidden = !c.cover;
  $("coverEmpty").hidden = !!c.cover;
  $("coverEmpty").textContent = editing ? "Tap to add a cover" : "No cover yet";

  const link = $("coverLink");
  if (!editing && url){
    link.href = url; link.target = "_blank"; link.rel = "noopener";
    link.setAttribute("aria-label", "Download the PDF of " + c.title);
  } else {
    link.removeAttribute("href"); link.removeAttribute("target");
    link.removeAttribute("rel"); link.removeAttribute("aria-label");
  }

  // sticker
  $("stickerBox").hidden = !(c.due || editing);

  // history (left alone while a link field in it is being typed in)
  const panel = $("histPanel");
  if (!panel.contains(document.activeElement)){
    panel.replaceChildren();
    const total = (state.history || []).length;
    if (!total){
      const p = document.createElement("div");
      p.className = "hist-empty";
      p.textContent = "No books yet.";
      panel.append(p);
    }
    for (let i = total - 1; i >= 0; i--){
      const b = state.history[i];
      const u = pdfUrl(b.pdf);
      const asLink = u && !editing;
      const el = document.createElement(asLink ? "a" : "div");
      el.className = "hist-item";
      if (asLink){ el.href = u; el.target = "_blank"; el.rel = "noopener"; }
      const t = document.createElement("strong");
      t.textContent = b.title || "Untitled";
      el.append(t);
      const sub = b.author || "";
      if (sub){
        const s = document.createElement("small");
        s.textContent = sub;
        el.append(s);
      }
      if (editing){
        const inp = document.createElement("input");
        inp.type = "url";
        inp.className = "edit-input";
        inp.placeholder = "Drive link for this book";
        inp.setAttribute("aria-label", "Drive link for " + (b.title || "this book"));
        inp.value = b.pdf || "";
        inp.addEventListener("input", e => queueHist(i, e.target.value.trim()));
        el.append(inp);
      }
      panel.append(el);
    }
  }

  fitAll();
}

function setMode(){
  document.body.classList.toggle("editing", editing);
  $("editBtn").textContent = editing ? "Done" : "Edit";
  setSave("");
  render();
}

/* ---------- events ---------- */
$("editBtn").addEventListener("click", () => {
  editing = !editing;
  if (!editing){ flush(); flushHist(); }
  setMode();
});

$("histBtn").addEventListener("click", e => {
  e.stopPropagation();
  const open = $("histPanel").hidden;
  $("histPanel").hidden = !open;
  $("histBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => {
  if (!$("histPanel").hidden && !$("histPanel").contains(e.target)){
    $("histPanel").hidden = true;
    $("histBtn").setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("histPanel").hidden){
    $("histPanel").hidden = true;
    $("histBtn").setAttribute("aria-expanded", "false");
    $("histBtn").focus();
  }
});

$("titleIn").addEventListener("input", e => {
  queue("title", e.target.value);
  $("titleView").textContent = e.target.value || "Untitled";
  fitTitle();
});
$("titleIn").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
});
$("authorIn").addEventListener("input", e => queue("author", e.target.value));
$("dueIn").addEventListener("input", e => {
  queue("due", e.target.value);
  fitSticker();
});
$("dueIn").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
});
$("pdfIn").addEventListener("input", e => queue("pdf", e.target.value.trim()));

async function resizeCover(file){
  const bmp = await createImageBitmap(file);
  const max = 720;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * scale);
  cv.height = Math.round(bmp.height * scale);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.82, out;
  do { out = cv.toDataURL("image/jpeg", q); q -= 0.12; } while (out.length > 600000 && q > 0.3);
  return out;
}
$("coverIn").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    setSave("Saving...");
    queue("cover", await resizeCover(file));
    render();
  } catch (err) {
    setSave("That image couldn't be read. Try a JPG or PNG.");
  }
});

$("newBtn").addEventListener("click", async () => {
  const c = state.current;
  if (!confirm("Move \u201C" + (c.title || "Untitled") + "\u201D to History and start a new book?")) return;
  await flush();
  try {
    await updateDoc(ref, {
      history: arrayUnion({title:c.title || "Untitled", author:c.author || "", pdf:c.pdf || ""}),
      current: {...NEW_BOOK}
    });
    setSave("New book started");
  } catch (err) {
    setSave("Couldn't start a new book. Check your connection and try again.");
  }
});

window.addEventListener("resize", fitAll);
if (document.fonts) document.fonts.ready.then(fitAll);

/* ---------- live data ---------- */
onSnapshot(ref, snap => {
  if (!snap.exists()){
    if (!snap.metadata.fromCache) setDoc(ref, {current:{...BLANK}, history:[]});
    return;
  }
  const d = snap.data();
  const hist = (d.history || []).map((b, i) => (i in histPending) ? {...b, pdf:histPending[i]} : b);
  state = {current:{...BLANK, ...d.current, ...pending}, history:hist};
  $("msg").hidden = true;
  document.body.classList.remove("loading");
  render();
}, () => {
  document.body.classList.remove("loading");
  $("msg").hidden = false;
  $("msg").textContent = "Couldn't load the book. Check your connection and refresh.";
});
</script>
</body>
</html>
